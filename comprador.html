<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnseñAI — Mi cuenta</title>
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --profundo: #1E3A8A; --profundo-oscuro: #16296B; --cielo: #60A5FA;
    --menta: #34D399; --aqua: #7DD3FC; --bosque: #065F46;
    --hielo: #F0FDF4; --tinta: #1E3A8A; --linea: #DCEEFC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Nunito', sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(96,165,250,0.35) 0, transparent 30%),
      radial-gradient(circle at 90% 20%, rgba(125,211,252,0.32) 0, transparent 32%),
      var(--hielo);
    color: var(--tinta); min-height: 100vh;
  }
  header { background: var(--profundo); color: #fff; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; }
  header a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 10px; }
  header .marca { font-family: 'Grandstander', sans-serif; font-weight: 700; font-size: 1.4rem; }
  header .marca .ai {
    display: inline-block; color: var(--aqua); background: rgba(255,255,255,0.14);
    padding: 1px 10px; border-radius: 999px; font-size: 0.75em; vertical-align: middle;
  }
  #btnSalir { background: none; border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 7px 14px; border-radius: 999px; font-size: 0.85rem; cursor: pointer; display: none; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 20px 80px; }
  .tarjeta { background: #fff; border: 2px solid var(--linea); border-radius: 18px; padding: 22px; margin-bottom: 18px; box-shadow: 0 3px 0 var(--linea); }
  h1 { font-family: 'Grandstander', sans-serif; font-size: 1.4rem; margin: 0 0 6px; text-align: center; }
  p.ayuda { color: #4A6A85; text-align: center; margin: 0 0 20px; }
  label { display: block; font-weight: 700; font-size: 0.9rem; margin: 14px 0 6px; }
  input { width: 100%; padding: 12px 14px; border: 2px solid var(--linea); border-radius: 12px; font-family: inherit; font-size: 1rem; }
  button.primario {
    width: 100%; background: var(--profundo); color: #fff; border: none; padding: 14px; border-radius: 999px;
    font-family: 'Grandstander', sans-serif; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 18px;
    box-shadow: 0 4px 0 var(--profundo-oscuro);
  }
  button.primario:disabled { opacity: 0.6; cursor: not-allowed; }
  button.secundario { width: 100%; background: none; border: none; color: #5b7d99; font-weight: 700; font-size: 0.9rem; cursor: pointer; margin-top: 10px; text-decoration: underline; }
  .enlace-chico { display: block; text-align: center; color: #5b7d99; font-size: 0.85rem; margin-top: 14px; cursor: pointer; text-decoration: underline; }
  .error { background: #FFF0EC; border: 2px solid #FFC4B5; color: #B94A2E; padding: 12px 14px; border-radius: 12px; margin-top: 14px; font-size: 0.9rem; }
  .aviso { background: var(--hielo); border: 2px dashed var(--menta); border-radius: 12px; padding: 12px 14px; font-size: 0.9rem; color: var(--bosque); margin-bottom: 18px; text-align: center; }
  .creditos-num { font-family: 'Grandstander', sans-serif; font-size: 2.2rem; color: var(--profundo); text-align: center; margin: 4px 0; }
  .creditos-label { text-align: center; color: #4A6A85; margin-bottom: 16px; }
  .paquetes { display: grid; gap: 10px; }
  .paquete { border: 2px solid var(--linea); border-radius: 14px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .paquete:hover { border-color: var(--cielo); }
  .paquete .nombre { font-weight: 700; }
  .paquete .precio { color: var(--bosque); font-weight: 700; }
  .curso-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px dashed var(--linea); }
  .curso-item:first-child { border-top: none; padding-top: 0; }
  .curso-item a { color: var(--profundo); font-weight: 700; text-decoration: none; }
  .cargando { text-align: center; padding: 40px 20px; color: #4A6A85; }
</style>
</head>
<body>

<header>
  <a href="index.html"><span class="marca">Enseñ<span class="ai">AI</span></span></a>
  <button id="btnSalir">Cerrar sesión</button>
</header>

<main id="contenido">
  <div class="cargando">Cargando…</div>
</main>

<script>
  const API_BASE = "https://ensenai-backend.onrender.com";
  const SUPABASE_URL = "https://azslvqfgeghhzghfxmdh.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF6c2x2cWZnZWdoaHpnaGZ4bWRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzOTUzMzksImV4cCI6MjEwMTk3MTMzOX0.zd22nrf9OUrg0h2YnGJJt9mkKzoFERM54F4S48r-xEQ";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const params = new URLSearchParams(window.location.search);
  let sesionActual = null;

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str || "";
    return d.innerHTML;
  }

  async function init() {
    const { data } = await supabaseClient.auth.getSession();
    document.getElementById("btnSalir").style.display = data.session ? "inline-block" : "none";

    if (params.get("compra") === "exitosa") {
      mostrarDashboard(data.session, "✓ ¡Pago recibido! Tus créditos ya están activos.");
      return;
    }

    if (params.get("suscripcion") === "exitosa") {
      mostrarDashboard(data.session, "✓ ¡Suscripción activada! Ya puedes generar temas ilimitados.");
      return;
    }

    if (data.session) {
      if (params.get("despues") === "curso" && params.get("slug") && params.get("comprar") !== "creditos") {
        window.location.href = `curso.html?slug=${encodeURIComponent(params.get("slug"))}`;
        return;
      }
      if (params.get("despues") === "paquete" && params.get("slug")) {
        window.location.href = `paquete.html?slug=${encodeURIComponent(params.get("slug"))}`;
        return;
      }
      if (params.get("despues") === "grupo") {
        window.location.href = "grupo.html";
        return;
      }
      if (params.get("despues") === "tema") {
        window.location.href = "tema.html";
        return;
      }
      mostrarDashboard(data.session);
    } else {
      mostrarLogin();
    }
  }

  function mostrarLogin() {
    document.getElementById("contenido").innerHTML = `
      <div class="tarjeta">
        <h1>Entra a tu cuenta</h1>
        <p class="ayuda">Para comprar y ver tus cursos.</p>
        <div id="error-auth"></div>
        <label for="correo">Correo</label>
        <input type="email" id="correo" placeholder="tucorreo@ejemplo.com">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" placeholder="Mínimo 6 caracteres">
        <button class="primario" id="btnEntrar">Entrar</button>
        <button class="secundario" id="btnCrearCuenta">¿No tienes cuenta? Regístrate</button>
        <span class="enlace-chico" id="btnOlvide">¿Olvidaste tu contraseña?</span>
      </div>
    `;
    document.getElementById("btnEntrar").addEventListener("click", () => iniciarSesion(false));
    document.getElementById("btnCrearCuenta").addEventListener("click", () => iniciarSesion(true));
    document.getElementById("btnOlvide").addEventListener("click", mostrarOlvideContrasena);
  }

  function mostrarOlvideContrasena() {
    document.getElementById("contenido").innerHTML = `
      <div class="tarjeta">
        <h1>Recupera tu contraseña</h1>
        <p class="ayuda">Te mandamos una liga a tu correo para poner una nueva.</p>
        <div id="error-auth"></div>
        <label for="correo-recuperar">Correo</label>
        <input type="email" id="correo-recuperar" placeholder="tucorreo@ejemplo.com">
        <button class="primario" id="btnMandarRecuperacion">Mandar liga de recuperación</button>
        <span class="enlace-chico" id="btnRegresarLogin">← Regresar a iniciar sesión</span>
      </div>
    `;
    document.getElementById("btnMandarRecuperacion").addEventListener("click", mandarRecuperacion);
    document.getElementById("btnRegresarLogin").addEventListener("click", mostrarLogin);
  }

  async function mandarRecuperacion() {
    const correo = document.getElementById("correo-recuperar").value.trim();
    const errorDiv = document.getElementById("error-auth");
    errorDiv.innerHTML = "";

    if (!correo) {
      errorDiv.innerHTML = `<div class="error">Escribe tu correo.</div>`;
      return;
    }

    const btn = document.getElementById("btnMandarRecuperacion");
    btn.disabled = true;
    btn.textContent = "Mandando…";

    try {
      const redirectTo = `${window.location.origin}/restablecer.html`;
      const { error } = await supabaseClient.auth.resetPasswordForEmail(correo, { redirectTo });
      if (error) throw new Error(error.message);

      document.getElementById("contenido").innerHTML = `
        <div class="tarjeta">
          <div class="aviso">✓ Si ese correo tiene una cuenta, te mandamos una liga para restablecer tu contraseña. Revisa tu bandeja (y spam).</div>
          <span class="enlace-chico" id="btnRegresarLogin2">← Regresar a iniciar sesión</span>
        </div>
      `;
      document.getElementById("btnRegresarLogin2").addEventListener("click", mostrarLogin);
    } catch (err) {
      errorDiv.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
      btn.disabled = false;
      btn.textContent = "Mandar liga de recuperación";
    }
  }

  async function iniciarSesion(esRegistro) {
    const correo = document.getElementById("correo").value.trim();
    const contrasena = document.getElementById("contrasena").value;
    const errorDiv = document.getElementById("error-auth");
    errorDiv.innerHTML = "";

    if (!correo || contrasena.length < 6) {
      errorDiv.innerHTML = `<div class="error">Escribe un correo válido y una contraseña de al menos 6 caracteres.</div>`;
      return;
    }

    try {
      const { data, error } = esRegistro
        ? await supabaseClient.auth.signUp({ email: correo, password: contrasena })
        : await supabaseClient.auth.signInWithPassword({ email: correo, password: contrasena });

      if (error) throw new Error(error.message);

      if (esRegistro && !data.session) {
        errorDiv.innerHTML = `<div class="error">Cuenta creada. Revisa tu correo para confirmarla, luego inicia sesión.</div>`;
        return;
      }

      init();
    } catch (err) {
      errorDiv.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
    }
  }

  async function mostrarDashboard(session, avisoExtra) {
    sesionActual = session;
    document.getElementById("contenido").innerHTML = `
      ${avisoExtra ? `<div class="aviso">${avisoExtra}</div>` : ""}
      <div class="tarjeta">
        <p class="creditos-label">Créditos disponibles</p>
        <div class="creditos-num" id="numCreditos">…</div>
      </div>
      <div class="tarjeta">
        <h1 style="text-align:left; font-size:1.1rem;">Mi suscripción</h1>
        <div id="zonaSuscripcion"><div class="cargando">Cargando…</div></div>
      </div>
      <div class="tarjeta">
        <h1 style="text-align:left; font-size:1.1rem;">✨ Genera material sobre un tema</h1>
        <p class="ayuda" style="margin:0 0 4px; text-align:left;">Explicación, trivia e imprimible adaptados a tu edad y a tu forma de aprender.</p>
        <a href="tema.html" style="display:block; text-decoration:none;"><button class="primario" style="margin-top:14px;">Generar tema</button></a>
      </div>
      <div class="tarjeta">
        <h1 style="text-align:left; font-size:1.1rem;">Estilo de aprendizaje</h1>
        <div id="zonaAprendizaje"><div class="cargando">Cargando…</div></div>
      </div>
      <div class="tarjeta">
        <h1 style="text-align:left; font-size:1.1rem;">Mis cursos</h1>
        <div id="listaCursos"><div class="cargando">Cargando…</div></div>
      </div>
      <div class="tarjeta">
        <h1 style="text-align:left; font-size:1.1rem;">Comprar más créditos</h1>
        <div class="paquetes" id="listaPaquetes"><div class="cargando">Cargando…</div></div>
      </div>
      <div class="tarjeta">
        <h1 style="text-align:left; font-size:1.1rem;">¿Eres maestro/a o psicólogo/a?</h1>
        <p class="ayuda" style="margin:0 0 4px; text-align:left;">Genera material para todo tu grupo y compártelo con una sola liga — tus alumnos o pacientes entran gratis, sin cuenta.</p>
        <a href="grupo.html" style="display:block; text-decoration:none;"><button class="primario" style="margin-top:14px;">🏫 Ir a Mi grupo</button></a>
      </div>
    `;

    cargarCreditos(session);
    cargarSuscripcion(session);
    cargarAprendizaje(session);
    cargarMisCursos(session);
    cargarPaquetes(session);

    document.getElementById("btnSalir").onclick = async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "comprador.html";
    };
  }

  async function cargarAprendizaje(session) {
    const cont = document.getElementById("zonaAprendizaje");
    try {
      const res = await fetch(`${API_BASE}/api/aprendizaje/mi-resultado`, {
        headers: { Authorization: `Bearer ${session.access_token}` },
      });
      const data = await res.json();

      if (!data.tiene_resultado) {
        cont.innerHTML = `
          <p class="ayuda" style="margin:0 0 12px;">Descubre cómo aprende mejor tu hijo/a con un mini-quiz de 5 preguntas.</p>
          <button class="primario" style="margin-top:0;" onclick="mostrarQuizAprendizaje()">Hacer el quiz</button>
        `;
        return;
      }

      cont.innerHTML = `
        <p class="ayuda" style="margin:0 0 8px; text-align:left;"><strong>Tipo dominante:</strong> ${data.dominantes_texto.map(escapeHtml).join(" y ")}</p>
        <p class="ayuda" style="margin:0; text-align:left; font-size:0.85rem;">Sugerencia de repaso: ${data.repaso_sugerido.map(escapeHtml).join(", ") || "sin sugerencia específica"}</p>
        <button class="secundario" onclick="mostrarQuizAprendizaje()">Repetir el quiz</button>
      `;
    } catch (err) {
      cont.innerHTML = `<div class="error">No se pudo cargar tu resultado.</div>`;
    }
  }

  async function mostrarQuizAprendizaje() {
    const cont = document.getElementById("zonaAprendizaje");
    cont.innerHTML = `<div class="cargando">Cargando preguntas…</div>`;

    const res = await fetch(`${API_BASE}/api/aprendizaje/quiz`);
    const data = await res.json();

    cont.innerHTML =
      data.preguntas
        .map(
          (p, i) => `
      <div style="margin-bottom:16px;">
        <p style="font-weight:700; margin-bottom:6px;">${i + 1}. ${escapeHtml(p.pregunta)}</p>
        <select id="pregunta-aprendizaje-${p.id}" style="width:100%; padding:10px; border:2px solid var(--linea); border-radius:10px;">
          <option value="">Elige una opción…</option>
          ${p.opciones.map((op, idx) => `<option value="${idx}">${escapeHtml(op)}</option>`).join("")}
        </select>
      </div>`
        )
        .join("") + `<button class="primario" onclick="enviarQuizAprendizaje()">Ver resultado</button>`;
  }

  async function enviarQuizAprendizaje() {
    const respuestas = [];
    for (let i = 1; i <= 5; i++) {
      const valor = document.getElementById(`pregunta-aprendizaje-${i}`).value;
      if (valor === "") {
        alert("Responde las 5 preguntas antes de continuar.");
        return;
      }
      respuestas.push(parseInt(valor, 10));
    }

    try {
      const res = await fetch(`${API_BASE}/api/aprendizaje/resultado`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${sesionActual.access_token}` },
        body: JSON.stringify({ respuestas }),
      });
      const data = await res.json();
      if (data.status !== "resultado_guardado") throw new Error(data.error || "No se pudo guardar el resultado.");

      cargarAprendizaje(sesionActual);
    } catch (err) {
      alert("Error: " + err.message);
    }
  }

  async function cargarSuscripcion(session) {
    const cont = document.getElementById("zonaSuscripcion");
    try {
      const res = await fetch(`${API_BASE}/api/purchases/mi-suscripcion`, { headers: { Authorization: `Bearer ${session.access_token}` } });
      const data = await res.json();

      if (data.tiene_suscripcion_activa) {
        const s = data.suscripcion;
        const etiquetaPlan = s.plan === "anual" ? "anual" : "mensual";
        cont.innerHTML = `
          <p class="ayuda" style="margin:0; text-align:left;">✓ Suscripción individual ${etiquetaPlan} activa${s.es_founder ? " — precio de fundador" : ""}${s.precio_mxn ? ` ($${Number(s.precio_mxn).toFixed(2)} MXN/${s.plan === "anual" ? "año" : "mes"})` : ""}.</p>
        `;
        return;
      }

      cont.innerHTML = `
        <p class="ayuda" style="margin:0 0 10px; text-align:left;">Genera temas ilimitados sin gastar créditos.</p>
        <button class="primario" style="margin-top:0;" id="btnSuscribirMensual">Suscribirme — mensual</button>
        <button class="secundario" style="width:100%; margin-top:8px;" id="btnSuscribirAnual">Ver plan anual</button>
      `;
      document.getElementById("btnSuscribirMensual").addEventListener("click", () => suscribirse(session, "individual", "mensual"));
      document.getElementById("btnSuscribirAnual").addEventListener("click", () => suscribirse(session, "individual", "anual"));
    } catch (err) {
      cont.innerHTML = `<div class="error">No se pudo cargar tu suscripción.</div>`;
    }
  }

  async function suscribirse(session, tipo, plan) {
    const cont = document.getElementById("zonaSuscripcion");
    cont.innerHTML = `<div class="cargando">Redirigiendo a pago seguro…</div>`;
    try {
      const res = await fetch(`${API_BASE}/api/purchases/checkout-suscripcion`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify({ tipo, plan }),
      });
      const data = await res.json();
      if (!data.checkout_url) throw new Error(data.error || "No se pudo iniciar el pago.");
      window.location.href = data.checkout_url;
    } catch (err) {
      cont.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
    }
  }

  async function cargarCreditos(session) {
    try {
      const res = await fetch(`${API_BASE}/api/purchases/mis-creditos`, { headers: { Authorization: `Bearer ${session.access_token}` } });
      const data = await res.json();
      document.getElementById("numCreditos").textContent = data.creditos_disponibles ?? "0";
    } catch (err) {
      document.getElementById("numCreditos").textContent = "—";
    }
  }

  async function cargarMisCursos(session) {
    const cont = document.getElementById("listaCursos");
    try {
      const res = await fetch(`${API_BASE}/api/purchases/mis-cursos`, { headers: { Authorization: `Bearer ${session.access_token}` } });
      const data = await res.json();
      const cursos = data.cursos || [];

      if (cursos.length === 0) {
        cont.innerHTML = `<p class="ayuda" style="margin:0;">Todavía no has comprado ningún curso.</p>`;
        return;
      }

      cont.innerHTML = cursos
        .map((c) => `<div class="curso-item"><a href="curso.html?slug=${encodeURIComponent(c.courses?.slug || "")}">${escapeHtml(c.courses?.title || "Curso")}</a></div>`)
        .join("");
    } catch (err) {
      cont.innerHTML = `<div class="error">No se pudieron cargar tus cursos.</div>`;
    }
  }

  async function cargarPaquetes(session) {
    const cont = document.getElementById("listaPaquetes");
    try {
      const { data: paquetes, error } = await supabaseClient.from("credit_packs").select("*").eq("active", true).order("credits", { ascending: true });
      if (error) throw new Error(error.message);

      cont.innerHTML = paquetes
        .map((p) => `<div class="paquete" data-id="${p.id}"><span class="nombre">${escapeHtml(p.label)}</span><span class="precio">$${Number(p.price_mxn).toFixed(2)} MXN</span></div>`)
        .join("");

      cont.querySelectorAll(".paquete").forEach((el) => {
        el.addEventListener("click", () => comprarPaquete(session, el.dataset.id, cont));
      });
    } catch (err) {
      cont.innerHTML = `<div class="error">No se pudieron cargar los paquetes.</div>`;
    }
  }

  async function comprarPaquete(session, creditPackId, cont) {
    cont.innerHTML = `<div class="cargando">Redirigiendo a pago seguro…</div>`;
    try {
      const res = await fetch(`${API_BASE}/api/purchases/checkout`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify({ creditPackId }),
      });
      const data = await res.json();
      if (!data.checkout_url) throw new Error(data.error || "No se pudo iniciar el pago.");
      window.location.href = data.checkout_url;
    } catch (err) {
      cont.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
    }
  }

  init();
</script>
</body>
</html>
