<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnseñAI — Mi grupo</title>
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --profundo: #1E3A8A; --profundo-oscuro: #16296B; --cielo: #60A5FA;
    --menta: #34D399; --aqua: #7DD3FC; --bosque: #065F46;
    --hielo: #F0FDF4; --tinta: #1E3A8A; --linea: #DCEEFC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Nunito', sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(96,165,250,0.35) 0, transparent 30%),
      radial-gradient(circle at 90% 20%, rgba(125,211,252,0.32) 0, transparent 32%),
      var(--hielo);
    color: var(--tinta); min-height: 100vh;
  }
  header { background: var(--profundo); color: #fff; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; }
  header a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 10px; }
  header .marca { font-family: 'Grandstander', sans-serif; font-weight: 700; font-size: 1.4rem; }
  header .marca .ai {
    display: inline-block; color: var(--aqua); background: rgba(255,255,255,0.14);
    padding: 1px 10px; border-radius: 999px; font-size: 0.75em; vertical-align: middle;
  }
  #btnSalir { background: none; border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 7px 14px; border-radius: 999px; font-size: 0.85rem; cursor: pointer; }
  main { max-width: 680px; margin: 0 auto; padding: 32px 20px 80px; }
  .tarjeta { background: #fff; border: 2px solid var(--linea); border-radius: 18px; padding: 22px; margin-bottom: 18px; box-shadow: 0 3px 0 var(--linea); }
  h1 { font-family: 'Grandstander', sans-serif; font-size: 1.4rem; margin: 0 0 6px; }
  h2 { font-family: 'Grandstander', sans-serif; font-size: 1.15rem; margin: 0 0 4px; }
  h3 { font-family: 'Grandstander', sans-serif; color: var(--bosque); font-size: 1rem; margin: 16px 0 8px; }
  p.ayuda { color: #4A6A85; margin: 0 0 16px; }
  label { display: block; font-weight: 700; font-size: 0.9rem; margin: 14px 0 6px; }
  input, select, textarea { width: 100%; padding: 12px 14px; border: 2px solid var(--linea); border-radius: 12px; font-family: inherit; font-size: 1rem; }
  textarea { resize: vertical; min-height: 70px; }
  button.primario {
    background: var(--profundo); color: #fff; border: none; padding: 14px 20px; border-radius: 999px;
    font-family: 'Grandstander', sans-serif; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 14px;
    box-shadow: 0 4px 0 var(--profundo-oscuro); width: 100%;
  }
  button.secundario { background: none; border: 2px solid var(--linea); color: var(--profundo); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 0.9rem; cursor: pointer; }
  button.chico { padding: 8px 14px; font-size: 0.85rem; margin-top: 0; width: auto; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error { background: #FFF0EC; border: 2px solid #FFC4B5; color: #B94A2E; padding: 12px 14px; border-radius: 12px; margin-top: 12px; font-size: 0.9rem; }
  .aviso { background: var(--hielo); border: 2px dashed var(--menta); border-radius: 12px; padding: 12px 14px; font-size: 0.9rem; color: var(--bosque); margin-bottom: 16px; }
  .cargando { text-align: center; padding: 40px 20px; color: #4A6A85; }
  .grupo-item { border: 2px solid var(--linea); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .grupo-item .nombre { font-family: 'Grandstander', sans-serif; font-weight: 700; font-size: 1.05rem; margin-bottom: 4px; }
  .metricas { display: flex; gap: 16px; margin: 10px 0; flex-wrap: wrap; }
  .metrica { background: var(--hielo); border-radius: 10px; padding: 8px 14px; text-align: center; }
  .metrica .num { font-family: 'Grandstander', sans-serif; font-weight: 700; color: var(--profundo); font-size: 1.2rem; }
  .metrica .label { font-size: 0.72rem; color: #4A6A85; text-transform: uppercase; letter-spacing: 0.02em; }
  .liga-box { display: flex; gap: 8px; align-items: center; background: var(--hielo); border-radius: 10px; padding: 8px 12px; margin: 10px 0; }
  .liga-box input { border: none; background: none; padding: 4px; font-size: 0.9rem; flex: 1; color: var(--bosque); font-weight: 700; }
  .tema-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px dashed var(--linea); gap: 10px; }
  .tema-item:first-child { border-top: none; }
  .tema-item .titulo { font-weight: 700; flex: 1; }
  .estado {
    font-size: 0.72rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .estado.pagado, .estado.gratis_prueba, .estado.cubierto_suscripcion { background: var(--hielo); color: var(--bosque); }
  .estado.pendiente { background: #FFF3E0; color: #B36B00; }
  .toggle-row { display: flex; align-items: center; gap: 10px; margin: 14px 0; }
  .toggle-row input { width: auto; }
  .divisor { border: none; border-top: 1px dashed var(--linea); margin: 18px 0; }
</style>
</head>
<body>

<header>
  <a href="index.html"><span class="marca">Enseñ<span class="ai">AI</span></span></a>
  <button id="btnSalir">Cerrar sesión</button>
</header>

<main id="contenido">
  <div class="cargando">Cargando…</div>
</main>

<script>
  const API_BASE = "https://ensenai-backend.onrender.com";
  const SUPABASE_URL = "https://azslvqfgeghhzghfxmdh.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF6c2x2cWZnZWdoaHpnaGZ4bWRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzOTUzMzksImV4cCI6MjEwMTk3MTMzOX0.zd22nrf9OUrg0h2YnGJJt9mkKzoFERM54F4S48r-xEQ";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const NIVELES = [
    { value: "primaria_baja", label: "Primaria baja (6-8 años)" },
    { value: "primaria_alta", label: "Primaria alta (9-12 años)" },
    { value: "secundaria", label: "Secundaria (12-15 años)" },
    { value: "preparatoria", label: "Preparatoria (15-18 años)" },
    { value: "universidad", label: "Universidad / autodidacta (18+)" },
  ];

  let sesionActual = null;

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str || "";
    return d.innerHTML;
  }

  async function init() {
    const { data } = await supabaseClient.auth.getSession();
    if (!data.session) {
      window.location.href = "comprador.html?despues=grupo";
      return;
    }
    sesionActual = data.session;

    document.getElementById("btnSalir").onclick = async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "comprador.html";
    };

    const qp = new URLSearchParams(window.location.search);
    let avisoInicial = null;
    if (qp.get("tema_grupo") === "activado") {
      avisoInicial = "✓ ¡Pago recibido! Tu tema ya está activo en la liga de tu grupo.";
    } else if (qp.get("suscripcion") === "exitosa") {
      avisoInicial = "✓ ¡Suscripción de grupo activada! Los temas que agregues quedan cubiertos automáticamente.";
    }

    cargarGrupos(avisoInicial);
  }

  async function cargarGrupos(avisoInicial) {
    const cont = document.getElementById("contenido");
    try {
      const res = await fetch(`${API_BASE}/api/grupos/mios`, {
        headers: { Authorization: `Bearer ${sesionActual.access_token}` },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "No se pudieron cargar tus grupos.");

      renderGrupos(data.grupos || [], avisoInicial);
    } catch (err) {
      cont.innerHTML = `<div class="tarjeta"><div class="error">${escapeHtml(err.message)}</div></div>`;
    }
  }

  function renderGrupos(grupos, avisoInicial) {
    const cont = document.getElementById("contenido");
    const ligaBase = `${window.location.origin}/g.html`;

    cont.innerHTML = `
      ${avisoInicial ? `<div class="aviso">${escapeHtml(avisoInicial)}</div>` : ""}
      <div class="tarjeta">
        <h1>Mi grupo</h1>
        <p class="ayuda">Genera material para tu salón o tus pacientes y compártelo con una sola liga — ellos entran gratis, sin cuenta, con solo su nombre.</p>
      </div>

      <div class="tarjeta">
        <h2>Mi suscripción de grupo</h2>
        <div id="zona-suscripcion-grupo"><div class="cargando">Cargando…</div></div>
      </div>

      ${grupos.length === 0 ? `<div class="tarjeta"><div class="aviso">Todavía no tienes ningún grupo — crea el primero abajo.</div></div>` : ""}

      ${grupos
        .map(
          (g) => `
        <div class="tarjeta grupo-item" data-grupo-id="${g.id}">
          <div class="nombre">🏫 ${escapeHtml(g.nombre)}</div>
          <div class="metricas">
            <div class="metrica"><div class="num">${g.temas_totales}</div><div class="label">Temas</div></div>
            <div class="metrica"><div class="num">${g.temas_activos}</div><div class="label">Activos</div></div>
            <div class="metrica"><div class="num">${g.accesos_registrados}</div><div class="label">Accesos</div></div>
          </div>
          <div class="liga-box">
            <input readonly value="${ligaBase}?slug=${encodeURIComponent(g.slug)}" id="liga-${g.id}">
            <button class="secundario chico" onclick="copiarLiga('${g.id}')">Copiar</button>
          </div>

          <hr class="divisor">
          <h3>Agregar un tema nuevo</h3>
          <div id="zona-generar-${g.id}">
            <label>Tema</label>
            <input type="text" id="tema-input-${g.id}" placeholder="Ej. El sistema solar, La Revolución Mexicana…">
            <label>Nivel del grupo</label>
            <select id="nivel-input-${g.id}">
              ${NIVELES.map((n) => `<option value="${n.value}">${n.label}</option>`).join("")}
            </select>
            <button class="primario" onclick="generarTema('${g.id}', ${g.temas_totales === 0})">✨ Generar material</button>
            <div id="resultado-generar-${g.id}"></div>
          </div>

          <hr class="divisor">
          <h3>Temas en tu liga</h3>
          <div id="lista-temas-${g.id}"><div class="cargando">Cargando…</div></div>
        </div>
      `
        )
        .join("")}

      <div class="tarjeta">
        <h2>${grupos.length === 0 ? "Crea tu primer grupo" : "Crear otro grupo"}</h2>
        <label>Nombre del grupo</label>
        <input type="text" id="nombre-grupo-nuevo" placeholder="Ej. 3ro B - Matemáticas, Pacientes miércoles…">
        <div class="toggle-row">
          <input type="checkbox" id="mostrar-nombres-nuevo" checked>
          <label style="margin:0;">Pedir nombre a quien entre a la liga</label>
        </div>
        <p class="ayuda" style="margin:6px 0 0; font-size:0.82rem;">Desactívalo si prefieres que entren de forma anónima (recomendado para psicólogos con pacientes).</p>
        <button class="primario" onclick="crearGrupo()">Crear grupo</button>
        <div id="resultado-crear-grupo"></div>
      </div>
    `;

    grupos.forEach((g) => cargarTemas(g.id));
    cargarSuscripcionGrupo();
  }

  async function cargarSuscripcionGrupo() {
    const cont = document.getElementById("zona-suscripcion-grupo");
    if (!cont) return;
    try {
      const res = await fetch(`${API_BASE}/api/purchases/mi-suscripcion`, {
        headers: { Authorization: `Bearer ${sesionActual.access_token}` },
      });
      const data = await res.json();

      if (data.tiene_suscripcion_activa && data.suscripcion.tipo === "grupo") {
        const s = data.suscripcion;
        cont.innerHTML = `<p class="ayuda" style="margin:0;">✓ Suscripción de grupo activa${s.es_founder ? " — precio de fundador" : ""}${s.precio_mxn ? ` ($${Number(s.precio_mxn).toFixed(2)} MXN/mes)` : ""}. Todos los temas que agregues quedan cubiertos automáticamente.</p>`;
        return;
      }

      cont.innerHTML = `
        <p class="ayuda" style="margin:0 0 10px;">En vez de pagar cada tema por separado, suscríbete y comparte temas ilimitados con tu grupo.</p>
        <button class="primario" style="margin-top:0;" id="btn-suscribir-grupo">Suscribirme — mensual</button>
      `;
      document.getElementById("btn-suscribir-grupo").addEventListener("click", suscribirGrupo);
    } catch (err) {
      cont.innerHTML = `<div class="error">No se pudo cargar tu suscripción.</div>`;
    }
  }

  async function suscribirGrupo() {
    const cont = document.getElementById("zona-suscripcion-grupo");
    cont.innerHTML = `<div class="cargando">Redirigiendo a pago seguro…</div>`;
    try {
      const res = await fetch(`${API_BASE}/api/purchases/checkout-suscripcion`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${sesionActual.access_token}` },
        body: JSON.stringify({ tipo: "grupo", plan: "mensual" }),
      });
      const data = await res.json();
      if (!data.checkout_url) throw new Error(data.error || "No se pudo iniciar el pago.");
      window.location.href = data.checkout_url;
    } catch (err) {
      cont.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
    }
  }

  function copiarLiga(grupoId) {
    const input = document.getElementById(`liga-${grupoId}`);
    input.select();
    navigator.clipboard?.writeText(input.value);
  }

  async function crearGrupo() {
    const nombre = document.getElementById("nombre-grupo-nuevo").value.trim();
    const mostrarNombres = document.getElementById("mostrar-nombres-nuevo").checked;
    const resultado = document.getElementById("resultado-crear-grupo");
    resultado.innerHTML = "";

    if (!nombre) {
      resultado.innerHTML = `<div class="error">Escribe un nombre para tu grupo.</div>`;
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/api/grupos`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${sesionActual.access_token}` },
        body: JSON.stringify({ nombre, mostrarNombres }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "No se pudo crear el grupo.");

      cargarGrupos();
    } catch (err) {
      resultado.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
    }
  }

  async function generarTema(grupoId, esPrimerTemaGratis) {
    const tema = document.getElementById(`tema-input-${grupoId}`).value.trim();
    const nivel = document.getElementById(`nivel-input-${grupoId}`).value;
    const resultado = document.getElementById(`resultado-generar-${grupoId}`);
    resultado.innerHTML = "";

    if (!tema) {
      resultado.innerHTML = `<div class="error">Escribe sobre qué tema quieres generar material.</div>`;
      return;
    }

    resultado.innerHTML = `<div class="cargando">Generando material con IA… puede tardar unos segundos.</div>`;

    try {
      const res = await fetch(`${API_BASE}/api/temas/generar`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${sesionActual.access_token}` },
        body: JSON.stringify({ tema, nivel, modo: "grupo" }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "No se pudo generar el material.");

      resultado.innerHTML = `
        <div class="aviso">✓ Material generado: <strong>${escapeHtml(data.contenido.tema || tema)}</strong>. Revísalo y agrégalo a tu liga.</div>
        <button class="primario" id="btn-agregar-${grupoId}">➕ Agregar a mi liga${esPrimerTemaGratis ? " (gratis)" : ""}</button>
        <button class="secundario" style="margin-top:10px; width:100%;" id="btn-pdf-${grupoId}">📄 Descargar imprimible (PDF)</button>
      `;
      document.getElementById(`btn-agregar-${grupoId}`).addEventListener("click", () =>
        agregarTemaAGrupo(grupoId, tema, data.contenido, esPrimerTemaGratis)
      );
      document.getElementById(`btn-pdf-${grupoId}`).addEventListener("click", (ev) =>
        descargarPdf(grupoId, data.contenido, ev.target)
      );
    } catch (err) {
      resultado.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
    }
  }

  // Cachea la URL del PDF ya generado por grupo, para no volver a generarlo
  // (llamada a IA de por medio) si el profesional ya lo descargó antes de
  // agregar el tema a su liga.
  const pdfCache = {};

  async function generarPdfEnServidor(contenido) {
    const res = await fetch(`${API_BASE}/api/temas/pdf`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${sesionActual.access_token}` },
      body: JSON.stringify({ contenido, modo: "grupo" }),
    });
    const data = await res.json();
    if (!data.pdf_url) throw new Error(data.error || "No se pudo generar el PDF.");
    return data.pdf_url;
  }

  async function descargarPdf(grupoId, contenido, btn) {
    const textoOriginal = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Preparando PDF…";
    try {
      const pdfUrl = pdfCache[grupoId] || (await generarPdfEnServidor(contenido));
      pdfCache[grupoId] = pdfUrl;
      window.open(pdfUrl, "_blank");
    } catch (err) {
      alert("Error: " + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = textoOriginal;
    }
  }

  async function agregarTemaAGrupo(grupoId, titulo, contenido, esPrimerTemaGratis) {
    const resultado = document.getElementById(`resultado-generar-${grupoId}`);
    resultado.innerHTML = `<div class="cargando">Agregando a tu liga…</div>`;

    try {
      // Si el profesional ya generó el PDF (o si falla, seguimos sin él —
      // no debe bloquear que el tema se agregue a la liga).
      let pdfUrl = pdfCache[grupoId] || null;
      if (!pdfUrl) {
        try {
          pdfUrl = await generarPdfEnServidor(contenido);
          pdfCache[grupoId] = pdfUrl;
        } catch (err) {
          pdfUrl = null;
        }
      }

      const res = await fetch(`${API_BASE}/api/grupos/${grupoId}/temas`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${sesionActual.access_token}` },
        body: JSON.stringify({ titulo, contenido, esPrimerTemaGratis, pdfUrl }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "No se pudo agregar el tema.");

      const tema = data.tema;
      if (tema.pago_status === "pendiente") {
        resultado.innerHTML = `
          <div class="aviso">Tema agregado — falta activarlo con un pago para que tu grupo lo vea.</div>
          <button class="primario" id="btn-pagar-${tema.id}">💳 Pagar y activar este tema</button>
        `;
        document.getElementById(`btn-pagar-${tema.id}`).addEventListener("click", () => pagarTema(tema.id));
      } else {
        resultado.innerHTML = `<div class="aviso">✓ ¡Listo! Ya está activo en tu liga.</div>`;
      }

      delete pdfCache[grupoId];
      document.getElementById(`tema-input-${grupoId}`).value = "";
      cargarTemas(grupoId);
      cargarGrupos();
    } catch (err) {
      resultado.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
    }
  }

  async function pagarTema(temaId) {
    try {
      const res = await fetch(`${API_BASE}/api/grupos/temas/${temaId}/checkout`, {
        method: "POST",
        headers: { Authorization: `Bearer ${sesionActual.access_token}` },
      });
      const data = await res.json();
      if (!data.checkout_url) throw new Error(data.error || "No se pudo iniciar el pago.");
      window.location.href = data.checkout_url;
    } catch (err) {
      alert("Error: " + err.message);
    }
  }

  const ETIQUETAS_ESTADO = {
    pendiente: "Pendiente de pago",
    pagado: "Activo (pagado)",
    cubierto_suscripcion: "Activo (suscripción)",
    gratis_prueba: "Activo (gratis)",
  };

  async function cargarTemas(grupoId) {
    const cont = document.getElementById(`lista-temas-${grupoId}`);
    if (!cont) return;
    try {
      const res = await fetch(`${API_BASE}/api/grupos/mios`, {
        headers: { Authorization: `Bearer ${sesionActual.access_token}` },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "No se pudieron cargar los temas.");
      const grupo = (data.grupos || []).find((g) => g.id === grupoId);
      const temas = grupo?.temas || [];

      if (temas.length === 0) {
        cont.innerHTML = `<p class="ayuda" style="margin:0;">Todavía no has agregado ningún tema.</p>`;
        return;
      }

      cont.innerHTML = temas
        .map(
          (t) => `
        <div class="tema-item">
          <span class="titulo">${escapeHtml(t.titulo)}</span>
          <span class="estado ${t.pago_status}">${escapeHtml(ETIQUETAS_ESTADO[t.pago_status] || t.pago_status)}</span>
          ${
            t.pago_status === "pendiente"
              ? `<button class="secundario chico" id="btn-pagar-lista-${t.id}">Pagar</button>`
              : ""
          }
        </div>
      `
        )
        .join("");

      temas
        .filter((t) => t.pago_status === "pendiente")
        .forEach((t) => {
          document.getElementById(`btn-pagar-lista-${t.id}`).addEventListener("click", () => pagarTema(t.id));
        });
    } catch (err) {
      cont.innerHTML = `<div class="error">No se pudieron cargar los temas.</div>`;
    }
  }

  init();
</script>
</body>
</html>
